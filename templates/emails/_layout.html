Subject: {{subject}}
<!--
  _layout.html  -  the branded shell every hub email is rendered into.
  Email-safe: table layout + inline styles only (Outlook does not support
  modern CSS, flexbox, grid, or style blocks reliably).
  Themed from event.<edition>.json via the brandColor / logoUrl / communityName
  tokens; the body token below is where the specific template's rendered content
  is placed, and the subject token carries that template's subject.
  Edit this ONE file to restyle every email.

  CRITICAL - DO NOT WRITE A TOKEN IN DOUBLE BRACES ANYWHERE IN THIS COMMENT.
  The renderer substitutes tokens across the WHOLE file, comments included. A
  documented body token here meant the entire rendered e-mail was injected INSIDE
  this comment: the body appeared once unstyled, this prose leaked into the message
  as visible text ending in an arrow, and the real body then rendered again below.
  That shipped to a live 2-day attendee (operator screenshot 2026-07-26).
  Name tokens in prose instead, exactly as done above.
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f2f4f7;margin:0;padding:24px 0;font-family:Aptos,'Segoe UI',Arial,Helvetica,sans-serif;">
  <tr>
    <td align="center">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border-radius:8px;overflow:hidden;max-width:600px;width:100%;">

        <!-- header (white background so a full-colour logo reads on any theme) -->
        <tr>
          <td style="background-color:#ffffff;padding:24px 32px;border-bottom:1px solid #e5e7eb;" align="left">
            <img src="{{logoUrl}}" alt="{{communityName}}" height="40" style="display:block;border:0;outline:none;text-decoration:none;height:40px;max-width:280px;">
          </td>
        </tr>

        <!-- body -->
        <tr>
          <td style="padding:32px;color:#1a1a2e;font-size:15px;line-height:1.6;">
            {{bodyContent}}
          </td>
        </tr>

        <!-- footer -->
        <tr>
          <td style="background-color:#f2f4f7;padding:20px 32px;color:#6b7280;font-size:12px;line-height:1.5;" align="left">
            <strong>{{eventDisplayName}}{{eventCodeParens}}</strong> &nbsp;Questions?<br>
            Contact <a href="mailto:{{supportEmail}}" style="color:{{brandColor}};">{{supportEmail}}</a>
          </td>
        </tr>

      </table>
    </td>
  </tr>
</table>
